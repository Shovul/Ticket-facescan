version: '3.8'

services:
  # 1. PostgreSQL with pgvector extension
  postgres:
    image: pgvector/pgvector:pg16
    container_name: eventpass-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-eventpass_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-rootpassword@123}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    networks:
      - eventpass-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-eventpass_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. AI Microservice (FastAPI + DeepFace)
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: eventpass-ai-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - AI_INTERNAL_API_KEY=${AI_INTERNAL_API_KEY:-eventpass_internal_ai_token_2026}
      - MODEL_NAME=Facenet512
      - DETECTOR_BACKEND=opencv
      - WARM_UP_ON_STARTUP=true
    volumes:
      # Mount weights cache so it doesn't re-download every container restart
      - deepface_weights:/root/.deepface/weights
    networks:
      - eventpass-network

  # 3. Backend Core (.NET 8 Clean Architecture)
  backend-core:
    build:
      context: ./backend-core
      dockerfile: Dockerfile
    container_name: eventpass-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
      - "5001:5001"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5000
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${DB_NAME:-eventpass_db};Username=${DB_USER:-postgres};Password=${DB_PASSWORD:-rootpassword@123};
      - AI_SERVICE_URL=http://ai-service:8000
      - AI_INTERNAL_API_KEY=${AI_INTERNAL_API_KEY:-eventpass_internal_ai_token_2026}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_started
    networks:
      - eventpass-network

  # 4. Frontend (Next.js 14 Client & Kiosk)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: eventpass-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000/api/v1
      - NEXT_PUBLIC_SIGNALR_URL=http://localhost:5000/hubs
    depends_on:
      - backend-core
    networks:
      - eventpass-network

volumes:
  postgres_data:
  deepface_weights:

networks:
  eventpass-network:
    driver: bridge
